# Regenerates the self-hosted stats cards used by the profile README.
# The cards are committed, so this runs on every push and once a day.

name: Update profile stats

on:
  push:
    branches: [ master ]
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The generated cards are committed; raw.githubusercontent.com serves them
      # from this branch, so a rename of the branch means updating the README.
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the generator
        run: npm test

      - name: Generate cards
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDED: ${{ secrets.EXCLUDED }}
          EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
        run: npm run generate

      - name: Commit the cards
        run: |
          if [ -z "$(git status --porcelain -- generated)" ]; then
            echo "Cards are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git commit -m "Update profile stats cards"
          git push
